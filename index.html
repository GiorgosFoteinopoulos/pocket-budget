<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pocket Budget</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/app.js" defer></script>
</head>
<body>
<main class="page">
    <h1>Pocket Budget</h1>
    <p id="summary">Loading...</p>

    <section class="totals">
        <div class="total">
            <span class="label">Income</span>
            <span id="total-income" class="value income">0.00 EUR</span>
        </div>
        <div class="total">
            <span class="label">Expenses</span>
            <span id="total-expenses" class="value expense">0.00 EUR</span>
        </div>
        <div class="total">
            <span class="label">Balance</span>
            <span id="total-balance" class="value">0.00 EUR</span>
        </div>
    </section>

    <form id="transaction-form" class="transaction-form">
        <input id="description" type="text" placeholder="Description" autocomplete="off">
        <input id="amount" type="number" step="0.01" placeholder="Amount">
        <select id="type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
        </select>
        <input id="date" type="date">
        <button type="submit">Add</button>
    </form>
    <p id="form-error" class="form-error"></p>

    <div class="filters">
        <button type="button" data-filter="all" class="active">All</button>
        <button type="button" data-filter="income">Income</button>
        <button type="button" data-filter="expense">Expenses</button>
    </div>

    <table class="transactions">
        <thead>
        <tr>
            <th>Date</th>
            <th>Description</th>
            <th class="amount">Amount</th>
            <th></th>
        </tr>
        </thead>
        <tbody id="transaction-rows"></tbody>
    </table>

    <p class="footer">
        <button id="reset-button" type="button" class="link-button">Reset to sample data</button>
    </p>
</main>
</body>
</html>
